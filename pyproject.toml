[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lecture-skipper"
version = "0.1.0"
description = "Local Ollama-powered YouTube lecture recommendations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["youtube-transcript-api>=1.2,<2", "ollama>=0.6,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
lecture-skipper = "main:main"

[tool.setuptools]
py-modules = ["main", "lecture_skipper"]
packages = ["ai_lecture_skipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
